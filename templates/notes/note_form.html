{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
    <h1>{{ heading }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save note</button>
        <a href="{% url 'notes:list' %}">Cancel</a>
    </form>
</section>
{% endblock %}
