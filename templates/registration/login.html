{% extends "base.html" %}
{% block title %}Login | Sticky Notes{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Login</button>
    </form>
    <p>New user? <a href="{% url 'register' %}">Register an account</a>.</p>
</section>
{% endblock %}
